    server:
      port: 8081

    # Downstream connection to Auth Core service
    auth-core:
      # In Docker this will be http://auth-core:8080, in local dev it defaults to localhost
      base-url: ${AUTH_CORE_BASE_URL:http://localhost:8080}
      connect-timeout-ms: 5000
      read-timeout-ms: 5000

    # Actuator configuration for health monitoring
    management:
      endpoints:
        web:
          exposure:
            include: health, info
      endpoint:
        health:
          show-details: always

    logging:
      level:
        com.latchpoint.adapter: DEBUG